name: RaceDay CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          test -f README.md
          test -d SQL_Queries
          test -d docs

      - name: Check SQL scripts
        run: |
          test -f SQL_Queries/01_Create_Database.sql
          test -f SQL_Queries/02_Create_RaceDayUsers.sql
          test -f SQL_Queries/03_Create_Events.sql
          test -f SQL_Queries/04_Create_Categories.sql
          test -f SQL_Queries/05_Create_Enrolments.sql
          test -f SQL_Queries/06_Create_Results.sql
          test -f SQL_Queries/07_Create_Routes.sql
          test -f SQL_Queries/08_Create_Weather.sql
          test -f SQL_Queries/09_Add_Foreign_Keys.sql
          test -f SQL_Queries/10_Insert_Users.sql
          test -f SQL_Queries/11_Insert_Events.sql
          test -f SQL_Queries/12_Insert_Categories.sql
          test -f SQL_Queries/13_Insert_Enrolments.sql
          test -f SQL_Queries/14_Insert_Results.sql
          test -f SQL_Queries/15_Insert_Routes.sql
          test -f SQL_Queries/16_Insert_Weather.sql

      - name: CI validation successful
        run: echo "RaceDay repository structure and SQL files validated successfully."
