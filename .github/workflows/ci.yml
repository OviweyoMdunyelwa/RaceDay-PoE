name: RaceDay CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate SQL folder
        run: |
          test -d SQL_Queries
          echo "SQL_Queries folder found successfully."

      - name: Validate SQL files
        run: |
          find SQL_Queries -name "*.sql" | wc -l
          echo "SQL scripts found."

      - name: CI validation successful
        run: echo "RaceDay CI validation completed successfully."
